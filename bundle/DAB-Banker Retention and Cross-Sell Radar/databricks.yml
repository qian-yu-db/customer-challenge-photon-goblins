# Meridian Bank — Retention & Cross-Sell Radar : Databricks Asset Bundle.
#
# Re-creates the whole demo on any workspace from scratch:
#   schema + raw_data volume + SDP pipeline + AI/BI dashboard + Databricks App shell,
#   created by `bundle deploy`; then a setup job fills them in on `bundle run`:
#     generate_data → run_pipeline → deploy_metric_view + deploy_genie
#     → grant_app_uc → export_resources (exits a JSON manifest of every resolved ID).
#
# This demo is Genie-backed (single agent) — NO Knowledge Assistant / Multi-Agent
# Supervisor / ML model. The app's data tool is `ask_genie` over the Genie space.
#
# ── 5-command deploy (the user runs these; see dab_instructions.md) ──────────
#   1. ./app/scripts/lakebase_setup_db.sh --db-name dbgen_meridian_radar
#   2. databricks bundle deploy --var catalog=… --var schema=… --var warehouse_id=…
#   3. databricks bundle run meridian_radar_setup --var …
#   4. ./app/scripts/lakebase_grant_app_credential.sh --app-name … --project-id … --db-name …
#   5. ./app/scripts/finalize_app.sh
#
# The Genie space id only exists AFTER the setup job's deploy_genie task runs, so the
# app env can't be baked at `deploy` time — export_resources exits the resolved IDs and
# finalize_app.sh writes them into app.yaml. One source of truth for app env.

bundle:
  name: meridian_radar

variables:
  catalog:
    description: "Unity Catalog for the Meridian retention demo"
    default: "solution_builder"
  schema:
    description: "Schema within the catalog (created by this bundle)"
    default: "demo_banker_retention_cross_sell_radar"
  warehouse_id:
    description: "SQL Warehouse ID — powers the dashboard, Genie, and the app's analytics"

  # ── App + Lakebase ───────────────────────────────────────────────────
  app_name:
    description: "Workspace app name (must be unique per workspace)"
    default: "dbgen-meridian-radar"
  lakebase_project_id:
    description: "Lakebase project — reused if it already exists"
    default: "dbdemos-asset-generator"
  lakebase_branch_id:
    description: "Lakebase branch within the project"
    default: "production"
  lakebase_database_name:
    description: "Postgres database name. Convention: dbgen_<demo>"
    default: "dbgen_meridian_radar"
  lakebase_database_id:
    description: |
      Lakebase database resource ID — the slug in the App's `postgres` binding path.
      Convention: `db-` + database_name with underscores → hyphens.
      Created by app/scripts/lakebase_setup_db.sh.
    default: "db-dbgen-meridian-radar"

# Build the app locally before sync — produces app/dist/server.js + app/client/dist/
# (both gitignored). sync.include whitelists them past .gitignore.
artifacts:
  default:
    build: ./app/scripts/build-app.sh

sync:
  include:
    - "src/**"
    - "app/dist/**"
    - "app/client/dist/**"
    - "app/drizzle/**"
  exclude:
    - "app/node_modules/**"
    - "app/.venv/**"
    - "app/.env"
    - "app/.env.*"
    - "app/.preview.pgid"
    - "app/.DS_Store"
    - "app/playwright-report/**"
    - "app/test-results/**"
    - "app/tests/**"

targets:
  dev:
    default: true
    # No `mode: development`: development mode force-prefixes the schema with
    # `dev_<user>_` (and `presets.name_prefix: ""` does NOT disable it — an empty
    # prefix is treated as unset and falls back to the default). The SDP silver
    # read_files() paths are hardcoded, so the schema — and thus the raw_data volume
    # path — must be exactly `${var.schema}`. Literal names give us that.
    # Pipelines still run in development mode via the pipeline's own config below.
  prod:
    mode: production

resources:
  # ── Schema + raw-data volume ──────────────────────────────────────────
  schemas:
    demo_schema:
      name: ${var.schema}
      catalog_name: ${var.catalog}
      comment: "Meridian Bank retention & cross-sell radar — accounts, transactions, balances, customer 360"

  volumes:
    raw_data:
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      name: "raw_data"
      volume_type: "MANAGED"
      comment: "Raw parquet landing zone (customers, accounts, transactions, balance_weekly)"

  # ── SDP pipeline : raw parquet → silver → gold ────────────────────────
  pipelines:
    meridian_pipeline:
      name: "[${bundle.target}] Meridian Retention Radar Pipeline"
      catalog: ${resources.schemas.demo_schema.catalog_name}
      target: ${resources.schemas.demo_schema.name}
      serverless: true
      photon: true
      channel: current
      libraries:
        - file:
            path: ./src/pipeline/silver.sql
        - file:
            path: ./src/pipeline/gold.sql

  # ── AI/BI dashboard : Retention + Cross-Sell ──────────────────────────
  dashboards:
    meridian_dashboard:
      display_name: "[${bundle.target}] Meridian Retention & Cross-Sell Radar"
      file_path: ./src/dashboard/dashboard.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${resources.schemas.demo_schema.catalog_name}
      dataset_schema: ${resources.schemas.demo_schema.name}

  # ── Databricks App : the RM's Retention & Cross-Sell Radar ────────────
  apps:
    meridian_app:
      name: ${var.app_name}
      description: "Meridian Bank Retention & Cross-Sell Radar — RM customer 360 + next-best-action; drafts retention + cross-sell offers and writes them back on approval"
      source_code_path: ./app
      lifecycle:
        prevent_destroy: true
      user_api_scopes:
        - serving.serving-endpoints   # /serving-endpoints/* (agent LLM)
        - ai-gateway                  # REQUIRED for the Responses API (routes through AI Gateway)
        - dashboards.genie            # ask_genie → the Genie space
        - sql                         # SQL warehouse
        - sql.statement-execution     # synchronous SQL exec (analytics charts)
        - postgres                    # Lakebase
        - catalog.catalogs:read
        - catalog.schemas:read
        - catalog.tables:read
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: postgres
          postgres:
            branch: projects/${var.lakebase_project_id}/branches/${var.lakebase_branch_id}
            database: projects/${var.lakebase_project_id}/branches/${var.lakebase_branch_id}/databases/${var.lakebase_database_id}
            permission: CAN_CONNECT_AND_CREATE

  # ── Setup job : fills the shells after `bundle deploy` ────────────────
  jobs:
    meridian_radar_setup:
      name: "[${bundle.target}] Meridian Retention Radar Setup"
      description: "data → pipeline → metric view + genie → grant app SP → export IDs"
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ./src/data_generation/generate_data.py
            base_parameters:
              catalog: ${resources.schemas.demo_schema.catalog_name}
              schema:  ${resources.schemas.demo_schema.name}
          environment_key: sdk_default

        - task_key: run_pipeline
          depends_on: [{ task_key: generate_data }]
          pipeline_task:
            pipeline_id: ${resources.pipelines.meridian_pipeline.id}

        - task_key: deploy_metric_view
          depends_on: [{ task_key: run_pipeline }]
          notebook_task:
            notebook_path: ./src/metric_view/mv_book_health.py
            base_parameters:
              catalog: ${resources.schemas.demo_schema.catalog_name}
              schema:  ${resources.schemas.demo_schema.name}
          environment_key: sdk_default

        - task_key: deploy_genie
          depends_on: [{ task_key: deploy_metric_view }]
          notebook_task:
            notebook_path: ./src/deploy/deploy_genie.py
            base_parameters:
              catalog:      ${resources.schemas.demo_schema.catalog_name}
              schema:       ${resources.schemas.demo_schema.name}
              warehouse_id: ${var.warehouse_id}
          environment_key: sdk_latest

        # Grant the app SP UC read privileges (USE_CATALOG/SCHEMA, SELECT, READ_VOLUME).
        # Distinct from lakebase_grant_app_credential.sh (which grants on the Postgres plane).
        - task_key: grant_app_uc
          depends_on: [{ task_key: run_pipeline }]
          notebook_task:
            notebook_path: ./src/deploy/grant_app_uc.py
            base_parameters:
              catalog:  ${resources.schemas.demo_schema.catalog_name}
              schema:   ${resources.schemas.demo_schema.name}
              app_name: ${var.app_name}
          environment_key: sdk_latest

        # Final task: exit a JSON manifest of every resolved ID. finalize_app.sh reads it
        # back via get-run-output (the notebook exit value IS retrievable post-run).
        - task_key: export_resources
          depends_on: [{ task_key: deploy_genie }, { task_key: grant_app_uc }]
          notebook_task:
            notebook_path: ./src/deploy/export_resources.py
            base_parameters:
              app_name:       ${var.app_name}
              catalog:        ${resources.schemas.demo_schema.catalog_name}
              schema:         ${resources.schemas.demo_schema.name}
              dashboard_id:   ${resources.dashboards.meridian_dashboard.id}
              pipeline_id:    ${resources.pipelines.meridian_pipeline.id}
              warehouse_id:   ${var.warehouse_id}
              genie_space_id: "{{tasks.deploy_genie.values.genie_space_id}}"
          environment_key: sdk_latest

      environments:
        - environment_key: sdk_default
          spec:
            client: "4"
        - environment_key: sdk_latest
          spec:
            client: "4"
            dependencies:
              - "databricks-sdk>=0.114.0"
